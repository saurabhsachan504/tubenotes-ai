# Production stack for the DGX.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Two deliberate differences from docker-compose.yml (the dev one):
#
# 1. Nothing is published to the public internet. The API is bound to
#    127.0.0.1:8011 on the host, so ONLY something running on the DGX itself -
#    i.e. aaPanel's Nginx - can reach it. Nginx terminates HTTPS and forwards.
#    Host port 8011 keeps this new deployment separate from the existing
#    TrialGuard API, which already occupies host port 8001.
#
# 2. Postgres publishes no port at all. The API reaches it over the private
#    compose network by the hostname "db". A database open to the internet is
#    how these things get wiped.
#
# restart: unless-stopped means the containers come back by themselves after a
# reboot or a crash. That is what makes this survive your laptop being off -
# nothing here depends on your machine.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trialguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trialguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trialguard:${POSTGRES_PASSWORD}@db:5432/trialguard
    depends_on:
      db:
        condition: service_healthy
    # Lets the container reach a service on the DGX itself by
    # host.docker.internal instead of going out to the public internet and
    # straight back in. vLLM is normally reached as http://gemma4:8000/v1 over
    # baota_net, which never leaves the box at all.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - baota_net

    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

    dns:
      - 1.1.1.1
      - 8.8.8.8

    ports:
      # host-only. Nginx proxies to this.
      - "127.0.0.1:8011:8000"
    # alembic upgrade head runs on every start: a new build applies its own
    # migrations before serving, so a deploy never leaves the schema behind.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
                    --workers 3 --proxy-headers --forwarded-allow-ips='*'
                    --timeout-graceful-shutdown 30"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  pgdata:

# vLLM (gemma4) apne alag stack me chalta hai - ~/gemma4-vllm/compose.yaml.
# Uske network se judne par api seedhe us container se baat karta hai; host ka
# port beech me aata hi nahi, isliye vLLM na LAN se dikhta hai na internet se.
#
# Model ko alag container me rakhna jaan-boojh kar hai: weights app ke deploy
# ke beech resident rehte hain (warna har `up` par 85s engine init), aur isi
# wajah se --workers 3 mumkin hai - 26B model ki teen copy nahi chahiye.
#
# CONCURRENCY CONTRACT: --workers 1 (upar) x VLLM_MAX_CONCURRENCY=30 (.env)
# = 30 = vLLM ka --max-num-seqs.
#
# Ek hi worker jaan-boojh kar hai. 3 x 10 ka hisaab sahi tha par behaviour
# nahi: 30 connection ka burst workers me barabar nahi batta - poora ka poora
# ek worker par gaya, aur vLLM "Running: 10, Waiting: 0" par baith gaya jabki
# do-tihai GPU khali thi. Per-worker gate ya to GPU kam use karega ya zyada
# bhar dega; bilkul theek wo tabhi ho jab workers aapas me baat karein.
# Ek worker se ye sawaal hi khatam. Kharcha kuch nahi: ye app per-request CPU
# kaam karta hi nahi - token relay karta hai - aur har blocking call pehle se
# thread pool me hai.
networks:
  baota_net:
    external: true
