<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeNotes settings</title>
  <style>
    :root { color-scheme: dark; }
    body { max-width: 620px; margin: 0 auto; padding: 56px 28px; background: #110d27; color: #f7f4ff; font: 16px/1.55 Arial, sans-serif; }
    .brand { display:flex; align-items:center; gap:10px; font-size:21px; font-weight:800; }
    .mark { display:inline-grid; place-items:center; width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#7c3aed,#ec4899); color:#fff; }
    .card { margin-top:24px; padding:24px; border:1px solid #56467e; border-radius:16px; background:#1a1335; }
    h1 { margin:0 0 10px; font-size:25px; } p { color:#d9d1ee; }
    button { margin-top:8px; padding:11px 16px; border:0; border-radius:10px; background:linear-gradient(135deg,#7c3aed,#db2777); color:white; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div class="brand"><span class="mark">▶</span> TubeNotes</div>
  <main class="card">
    <h1>Extension settings</h1>
    <p>TubeNotes securely uses your signed-in TubeNotes account. Summary, notes, translation and video questions are processed through <strong>tubenotes.ai</strong>; no separate API server setup is needed.</p>
    <button id="openAccount" type="button">Open account</button>
  </main>
  <script src="browser-polyfill.js"></script>
  <script src="options.js"></script>
</body>
</html>
