<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Summary</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #6b7280;
      --line: #e5e7eb;
      --c1: #4f46e5; --c1bg: #eef0ff;   /* indigo  */
      --c2: #0f9d58; --c2bg: #e7f6ee;   /* green   */
      --c3: #d97706; --c3bg: #fdf1de;   /* amber   */
      --c4: #db2777; --c4bg: #fce8f1;   /* pink    */
      --c5: #0284c7; --c5bg: #e2f2fb;   /* blue    */
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", "Noto Sans", "Noto Sans Devanagari",
                   "Nirmala UI", "Mangal", Arial, sans-serif;
      max-width: 780px;
      margin: 0 auto 60px;
      padding: 0 26px;
      color: var(--ink);
      line-height: 1.85;
      font-size: 16px;   /* comfortable for children & older readers */
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Colourful header banner ---- */
    .cover {
      margin: 0 -26px 28px;
      padding: 32px 34px 24px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
      color: #fff;
      border-radius: 0 0 20px 20px;
    }
    .cover .kicker {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      opacity: 0.9; font-weight: 700; margin-bottom: 10px;
    }
    .cover h1 { font-size: 25px; line-height: 1.3; margin: 0 0 14px; font-weight: 800; }
    .cover .src {
      font-size: 12px; word-break: break-all;
      background: rgba(255,255,255,0.16); padding: 7px 12px;
      border-radius: 8px; display: inline-block; max-width: 100%;
    }
    .cover .src a { color: #fff; text-decoration: none; }

    /* ---- Section headings: coloured card + left accent (rotating palette) ---- */
    h2 {
      font-size: 19px; font-weight: 800; margin: 30px 0 12px;
      padding: 11px 16px; border-radius: 10px;
      border-left: 6px solid var(--c1);
      background: var(--c1bg); color: #1a1a1a;
    }
    h2:nth-of-type(5n+2){ border-left-color:var(--c2); background:var(--c2bg); }
    h2:nth-of-type(5n+3){ border-left-color:var(--c3); background:var(--c3bg); }
    h2:nth-of-type(5n+4){ border-left-color:var(--c4); background:var(--c4bg); }
    h2:nth-of-type(5n+5){ border-left-color:var(--c5); background:var(--c5bg); }

    h3 { font-size: 16px; font-weight: 700; margin: 18px 0 6px; color: #374151; }
    h3.recap {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
      color: #7c3aed; border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 18px;
    }

    /* ---- Body: simple black, easy to read ---- */
    p { margin: 9px 0; color: var(--ink); text-align: justify; }
    strong { color: #000; font-weight: 700; }

    ul, ol { margin: 8px 0 12px; padding-left: 4px; }
    li { margin: 6px 0; list-style: none; padding-left: 24px; position: relative; color: var(--ink); }
    ul li::before {
      content: ""; position: absolute; left: 6px; top: 10px;
      width: 7px; height: 7px; border-radius: 50%; background: #4f46e5;
    }
    ol { counter-reset: item; }
    ol li { counter-increment: item; }
    ol li::before {
      content: counter(item); position: absolute; left: 0; top: 2px;
      width: 19px; height: 19px; border-radius: 50%;
      background: #4f46e5; color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    mark.hl { background: #fff3a8; padding: 0 3px; border-radius: 2px; }

    .footer {
      margin-top: 40px; padding-top: 14px; border-top: 2px solid var(--line);
      font-size: 11px; color: var(--muted); text-align: center;
    }

    .hint {
      background: #fffbeb; border: 1px solid #fcd34d;
      padding: 11px 15px; border-radius: 10px; font-size: 13px; margin: 18px 0 4px;
      color: #92400e;
    }

    @media print {
      .hint { display: none; }
      body { margin: 0; max-width: 100%; }
      .cover { border-radius: 0; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>
  <div class="hint">
    Print dialog me <strong>Destination: Save as PDF</strong> chuno, phir <strong>Save</strong> dabao. (More settings → <strong>Background graphics</strong> ON rakho taaki colours aayen.)
  </div>

  <div class="cover">
    <div class="kicker">✨ Video Notes</div>
    <h1 id="title">Loading…</h1>
    <div class="src" id="meta"></div>
  </div>

  <div id="content"></div>

  <div class="footer">Generated by TubeNotes</div>

  <script src="browser-polyfill.js"></script>
  <script src="print.js"></script>
</body>
</html>
