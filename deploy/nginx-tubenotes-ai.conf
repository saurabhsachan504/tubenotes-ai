# aaPanel -> Website -> tubenotes.ai -> Config file
#
# Create a separate TubeNotes.ai site, enable its SSL/Force HTTPS, then put
# this location block inside that site's server{} block. Do not change the
# existing tubenotes.trueworks.in site: it continues proxying to :8001.

location / {
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";

    # Keep streamed summaries and long notes streaming immediately.
    gzip off;
    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    client_max_body_size 25m;
}
