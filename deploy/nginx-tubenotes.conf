# ---------------------------------------------------------------------------
# aaPanel -> Website -> tubenotes.in -> Config file
#
# Ye POORI file paste mat karna. aaPanel apni SSL wali lines khud likhta hai.
# Sirf neeche wala `location /` block apne site ke server{} ke andar daalo -
# aur agar aaPanel ne pehle se koi `location /` banaya hai to use replace kar do.
#
# Steps: aaPanel -> Website -> Add site (domain: tubenotes.in,
# PHP: pure static / no PHP) -> SSL -> Let's Encrypt -> Apply -> "Force HTTPS" ON
# -> phir Config file kholo aur ye block daalo.
# ---------------------------------------------------------------------------

location / {
    proxy_pass http://127.0.0.1:8000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";

    # ---- SABSE ZAROORI LINE: gzip off ----------------------------------
    # Maine ise naapa hai. Summary aur full notes NDJSON stream karke aate
    # hain (ek-ek line, jaise-jaise banti hai). gzip ON hone par Nginx poora
    # response jama karke compress karta hai, isliye user ko PEHLA byte tabhi
    # milta hai jab SAB kuch ban chuka ho:
    #
    #   gzip on   -> pehla byte 5.01s par (poora response bhi 5.01s)
    #   gzip off  -> pehla byte 0.00s par  (poora response 5.01s)
    #
    # Full notes 20-30 minute lete hain, yaani gzip ON ke saath user ko itni
    # der khali screen dikhegi. aaPanel naye site mein gzip khud ON karta hai,
    # isliye ye line yahan honi hi chahiye.
    gzip off;

    # Ye extra safety hai. Mere test mein sirf proxy_buffering off se koi
    # farak nahi pada (dono mein pehla byte turant aaya) - asli mujrim gzip
    # tha. Phir bhi ise rakh rahe hain: badi lines aur alag buffer size par
    # buffering rok sakti hai, aur isse kuch nuksan nahi.
    proxy_buffering off;
    proxy_cache off;
    # --------------------------------------------------------------------

    # Ek chunk Ollama ke andar 60s se zyada le sakta hai aur us dauran upstream
    # bilkul chup rehta hai. Nginx ka default proxy_read_timeout 60s hai -
    # us par connection beech mein hi tut jata hai. Naapa hua:
    #
    #   read_timeout 5s  + upstream 8s chup -> connection toot gaya (5.0s par)
    #   read_timeout 3600s + wahi upstream  -> 200 OK (8.0s par)
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # Transcript/notes ka payload bada ho sakta hai
    client_max_body_size 25m;
}

# aaPanel kabhi-kabhi in do rules ko site ke config mein daal deta hai; agar
# dikhein to hata do, warna /docs ya /static ke request 404 ho jayenge:
#
#   location ~ .*\.(gif|jpg|jpeg|png|css|js|...)$ { expires 12h; }
#   location ~ /\.  { deny all; }
