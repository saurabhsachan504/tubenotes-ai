# TubeNotes.ai production stack that reuses TrialGuard's existing PostgreSQL.
#
# It deliberately has NO db service and NO database volume. The existing
# /opt/trialguard stack remains the only owner of PostgreSQL on 127.0.0.1:5433.
# Start it with:
#   docker compose -p tubenotes-ai -f docker-compose.shared-db.prod.yml up -d --build

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The existing database is published on the DGX loopback address. Docker
      # reaches that host-only port through the explicit host-gateway mapping.
      DATABASE_URL: postgresql+psycopg://trialguard:${POSTGRES_PASSWORD}@host.docker.internal:5433/trialguard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - baota_net
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      # A separate host-only API port. The TubeNotes.ai Nginx site proxies here.
      - "127.0.0.1:8011:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
                    --workers 3 --proxy-headers --forwarded-allow-ips='*'
                    --timeout-graceful-shutdown 30"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

networks:
  # Existing network where the Gemma/vLLM container runs.
  baota_net:
    external: true
